# =============================================================================
# AgentBook · nginx 反向代理（纯 HTTP，无 TLS）
#
# 仅限：内网访问 / 前面已有别的层做 TLS 终止（如云厂商 LB、CDN）的场景。
# 公网直暴露请用 agentbook.conf（带 TLS）。
#
# 用法：
#   sudo ln -s /opt/agentbook/deploy/nginx/agentbook-http.conf /etc/nginx/sites-enabled/agentbook.conf
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 任意主机名

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 实时推送：关缓冲（同 TLS 版）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
