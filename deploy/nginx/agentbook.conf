# =============================================================================
# AgentBook · nginx 反向代理（标准 vhost，include / symlink 即用）
#
# 用法（装完 AgentBook 后）：
#   sudo ln -s /opt/agentbook/deploy/nginx/agentbook.conf /etc/nginx/sites-enabled/agentbook.conf
#   # 把下面两处 server_name 改成你的域名，并把 ssl_certificate* 路径改成你的证书
#   sudo nginx -t && sudo systemctl reload nginx
#
# 一键拿证书（有域名时，certbot 会自动改好证书路径）：
#   sudo certbot --nginx -d 你的域名
#
# 关键点（避免踩坑）：
#   - 80 端口仅做 301 跳 HTTPS（含 /.well-known/acme-challenge 挑战目录，certbot 用得上）
#   - 443 反代到本机 AgentBook（127.0.0.1:8080）
#   - Cookie 鉴权（an_token）由后端 Set-Cookie 自动透传，无需额外配置
#   - /api/events 为 SSE 实时推送，必须 proxy_buffering off，否则流式更新被缓冲卡死
# =============================================================================

# —— HTTP：全部 301 跳转 HTTPS ——
server {
    listen 80;
    listen [::]:80;
    server_name agentbook.example.com;   # ← 改成你的域名（或临时用 _ 配 certbot 时再改）

    # Let's Encrypt 等证书申请用，保留
    location /.well-known/acme-challenge/ {
        root /var/www/_acme-challenge;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# —— HTTPS：反代到本机 AgentBook ——
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentbook.example.com;   # ← 改成你的域名

    # —— TLS 证书（改成你的路径；certbot 默认在 /etc/letsencrypt/live/<域名>/）——
    ssl_certificate     /etc/letsencrypt/live/agentbook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentbook.example.com/privkey.pem;

    # —— 现代 TLS 配置（Mozilla 中间档，A 级）——
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP 装订（resolver 不可达时仅不装订，不影响服务）
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 上传体积（API Key / 配置保存，按需调大）
    client_max_body_size 10m;

    # —— 反代到本机 AgentBook ——
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 透传真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api/events 实时推送）必须关缓冲，否则流式更新被卡死
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;     # SSE 长连，超时拉长
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
